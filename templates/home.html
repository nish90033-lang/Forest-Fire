
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FWI Prediction</title>
</head>

<body>

    <h1>FWI Prediction</h1>

    <form action="{{ url_for('predict_datapoint') }}" method="post">

        <input type="number" step="any" name="Temperature"
               placeholder="Temperature" required><br>

        <input type="number" step="any" name="RH"
               placeholder="RH" required><br>

        <input type="number" step="any" name="Ws"
               placeholder="Ws" required><br>

        <input type="number" step="any" name="Rain"
               placeholder="Rain" required><br>

        <input type="number" step="any" name="FFMC"
               placeholder="FFMC" required><br>

        <input type="number" step="any" name="DMC"
               placeholder="DMC" required><br>

        <input type="number" step="any" name="ISI"
               placeholder="ISI" required><br>

        <input type="number" step="any" name="Classes"
               placeholder="Classes" required><br>

        <input type="number" step="any" name="Region"
               placeholder="Region" required><br><br>

        <button type="submit"
                class="btn btn-primary btn-block btn-large">
            Predict
        </button>

    </form>

    {% if result is defined %}
        <h2>THE FWI prediction is {{ result }}</h2>
    {% endif %}

    {% if error is defined %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

</body>

</html>
